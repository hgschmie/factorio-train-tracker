[mod-setting-description]
hps__tt-debug-mode=Aktiviert den Programmfehlerbeseitigungsmodus
hps__tt-use_named_temp_stops=Aktiviere diese Einstellung wenn ein mod Fahrpläne mit temporären Haltestellen erstellt (z.B. CyberSyn). In diesem Fall werden die temporären Haltestellen mit Namen als normale Haltestellen behandelt. Aktiviere die Einstellung NICHT wenn LTN verwendet wird. Diese Einstellung kann mit mods kollidieren, die Züge automatisch auftanken und temporäre Stops verwenden.
