[mod-setting-name]
hps__tt-debug-mode=Debugging Mode
hps__tt-use_named_temp_stops=Named temporary stops are considered regular stops

[mod-setting-description]
hps__tt-debug-mode=Enables debugging information
hps__tt-use_named_temp_stops=Treat named temporary stops as regular stops. Turn this on if you use some automated train scheduling system (e.g. CyberSyn) that uses uses temporary stops for providers and requesters. DO NOT turn on if you use LTN. This may interfere with some automatic refueler mods that use named temporary stops for refueling.
